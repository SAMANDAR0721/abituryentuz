<style>
:root{--bg:#f5f2ff;--card:#fff;--tx:#1b1340;--mut:#6b6690;--v:#6c4df6;--co:#ff5c7a;--ye:#ffb400;--mi:#12c99a;--bd:#e6e0fb}
:root[data-t=dark]{--bg:#141030;--card:#1f1a45;--tx:#f3f0ff;--mut:#a9a3d6;--bd:#33305f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px max(32px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:linear-gradient(135deg,var(--v) 0%,var(--co) 100%);color:#fff;border-radius:26px;padding:22px 20px;margin-bottom:16px}
h1{font-size:30px;line-height:1.05;margin:0 0 6px;font-weight:900;letter-spacing:-.03em}
.hero p{margin:0;font-size:15px;opacity:.92;max-width:22ch}
.lang{display:flex;background:rgba(255,255,255,.22);border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:none;color:#fff;padding:6px 12px;border-radius:999px;font-weight:800;font-size:14px;font-family:inherit}
.lang button.on{background:#fff;color:var(--v)}
section{background:var(--card);border-radius:24px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(108,77,246,.10)}
h2{font-size:19px;margin:0 0 2px;font-weight:800}
.hint{color:var(--mut);font-size:14px;margin:0 0 12px}
input[type=search]{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
input[type=search]:focus{outline:none;border-color:var(--v)}
.list{max-height:280px;overflow:auto;margin-top:10px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:16px;padding:10px;color:var(--tx);font-size:15px;line-height:1.3;font-family:inherit}
.item small{display:block;color:var(--mut);margin-top:2px}
.item:active{background:var(--bg)}
.ic{flex:none;width:42px;height:42px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:22px}
.pick b{font-size:20px;line-height:1.2;font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border-radius:999px;padding:6px 12px;font-size:14px;font-weight:800;color:#fff}
.c0{background:var(--mi)}.c1{background:var(--ye);color:#2a1d00}.c2{background:var(--co)}
.row{margin:18px 0 6px}
.row label{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.row label span{color:var(--mut);white-space:nowrap}
input[type=range]{width:100%;height:28px;margin:6px 0 0}
.score{background:var(--v);color:#fff;border-radius:22px;padding:18px;margin-top:20px}
.total{font-size:52px;font-weight:900;letter-spacing:-.04em;line-height:1}
.total small{font-size:20px;opacity:.75;font-weight:700}
.pop{animation:pop .28s}
@keyframes pop{50%{transform:scale(1.06)}}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.22);margin-top:14px}
.bar i{display:block;transition:width .25s}
.note{color:var(--mut);font-size:13px;margin:12px 0 0}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:800;font-family:inherit;background:var(--v);color:#fff;margin-top:10px}
.btn.alt{background:var(--bg);color:var(--tx)}.btn:disabled{opacity:.45}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:13px 14px;margin-top:10px;font-size:16px;font-family:inherit}
.opt.ok{border-color:var(--mi);background:rgba(18,201,154,.15)}.opt.bad{border-color:var(--co);background:rgba(255,92,122,.15)}
.tp{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:6px 0 14px}.tp i{display:block;height:100%;background:var(--v)}
.qt{font-size:19px;font-weight:800;line-height:1.35}.ex{margin-top:12px;padding:12px;border-radius:14px;background:var(--bg);font-size:14px;color:var(--mut)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}.pop{animation:none}}
</style></head>
